foreground: &foreground "#d3c6aa"
background: &background "#2d353b"
current_line: &current_line "#543a48"
selection: &selection "#475258"
comment: &comment "#7a8478"
cyan: &cyan "#83c092"
green: &green "#a7c080"
yellow: &yellow "#dbbc7f"
orange: &orange "#e69875"
magenta: &magenta "#d699b6"
blue: &blue "#7fbbb3"
red: &red "#e67e80"
purple: &purple "#d699b6"
pink: &pink "#d699b6"
white: &white "#9da9a0"
black: &black "#232a2e"

k9s:
  # General K9s styles
  body:
    fgColor: *foreground
    bgColor: default
    logoColor: *green
  # Command prompt styles
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *orange
  # ClusterInfoView styles.
  info:
    fgColor: *magenta
    sectionColor: *foreground
  # Dialog styles.
  dialog:
    fgColor: *foreground
    bgColor: default
    buttonFgColor: *foreground
    buttonBgColor: *magenta
    buttonFocusFgColor: *background
    buttonFocusBgColor: *foreground
    labelFgColor: *comment
    fieldFgColor: *foreground
  frame:
    # Borders styles.
    border:
      fgColor: *selection
      focusColor: *foreground
    menu:
      fgColor: *foreground
      keyColor: *magenta
      # Used for favorite namespaces
      numKeyColor: *magenta
    # CrumbView attributes for history navigation.
    crumbs:
      fgColor: *white
      bgColor: *cyan
      activeColor: *yellow
    # Resource status and update styles
    status:
      newColor: *magenta
      modifyColor: *blue
      addColor: *green
      errorColor: *red
      highlightcolor: *orange
      killColor: *comment
      completedColor: *comment
    # Border title styles.
    title:
      fgColor: *foreground
      bgColor: default
      highlightColor: *green
      counterColor: *magenta
      filterColor: *magenta
  views:
    # Charts skins...
    charts:
      bgColor: default
      defaultDialColors:
        - *green
        - *red
      defaultChartColors:
        - *green
        - *red
    # TableView attributes.
    table:
      fgColor: *foreground
      bgColor: default
      cursorFgColor: *background
      cursorBgColor: *foreground
      markColor: darkgoldenrod
      # Header row styles.
      header:
        fgColor: *foreground
        bgColor: default
        sorterColor: *cyan
    # Xray view attributes.
    xray:
      fgColor: *foreground
      bgColor: default
      cursorColor: *current_line
      graphicColor: *green
      showIcons: false
    # YAML info styles.
    yaml:
      keyColor: *magenta
      colonColor: *blue
      valueColor: *foreground
    # Logs styles.
    logs:
      fgColor: *foreground
      bgColor: default
      indicator:
        fgColor: *foreground
        bgColor: *selection
    help:
      fgColor: *foreground
      bgColor: default
      indicator:
        fgColor: *red
        bgColor: *selection
