foreground: &foreground "#ebdbb2"
background: &background "#282828"
current_line: &current_line "#504945"
selection: &selection "#3c3836"
comment: &comment "#928374"
cyan: &cyan "#8ec07c"
green: &green "#b8bb26"
yellow: &yellow "#fabd2f"
orange: &orange "#fe8019"
magenta: &magenta "#d3869b"
blue: &blue "#83a598"
red: &red "#fb4934"
purple: &purple "#d3869b"
pink: &pink "#d3869b"
white: &white "#a89984"
black: &black "#1d2021"

k9s:
  # General K9s styles
  body:
    fgColor: *foreground
    bgColor: default
    logoColor: *green
  # Command prompt styles
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *orange
  # ClusterInfoView styles.
  info:
    fgColor: *magenta
    sectionColor: *foreground
  # Dialog styles.
  dialog:
    fgColor: *foreground
    bgColor: default
    buttonFgColor: *foreground
    buttonBgColor: *magenta
    buttonFocusFgColor: *background
    buttonFocusBgColor: *foreground
    labelFgColor: *comment
    fieldFgColor: *foreground
  frame:
    # Borders styles.
    border:
      fgColor: *selection
      focusColor: *foreground
    menu:
      fgColor: *foreground
      keyColor: *magenta
      # Used for favorite namespaces
      numKeyColor: *magenta
    # CrumbView attributes for history navigation.
    crumbs:
      fgColor: *white
      bgColor: *cyan
      activeColor: *yellow
    # Resource status and update styles
    status:
      newColor: *magenta
      modifyColor: *blue
      addColor: *green
      errorColor: *red
      highlightcolor: *orange
      killColor: *comment
      completedColor: *comment
    # Border title styles.
    title:
      fgColor: *foreground
      bgColor: default
      highlightColor: *green
      counterColor: *magenta
      filterColor: *magenta
  views:
    # Charts skins...
    charts:
      bgColor: default
      defaultDialColors:
        - *green
        - *red
      defaultChartColors:
        - *green
        - *red
    # TableView attributes.
    table:
      fgColor: *foreground
      bgColor: default
      cursorFgColor: *background
      cursorBgColor: *foreground
      markColor: darkgoldenrod
      # Header row styles.
      header:
        fgColor: *foreground
        bgColor: default
        sorterColor: *cyan
    # Xray view attributes.
    xray:
      fgColor: *foreground
      bgColor: default
      cursorColor: *current_line
      graphicColor: *green
      showIcons: false
    # YAML info styles.
    yaml:
      keyColor: *magenta
      colonColor: *blue
      valueColor: *foreground
    # Logs styles.
    logs:
      fgColor: *foreground
      bgColor: default
      indicator:
        fgColor: *foreground
        bgColor: *selection
    help:
      fgColor: *foreground
      bgColor: default
      indicator:
        fgColor: *red
        bgColor: *selection
