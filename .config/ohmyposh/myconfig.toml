terminal_background = 'p:t-background'
console_title_template = ' {{ .Folder }} :: {{if .Root}}Admin{{end}}'
version = 3
final_space = true

[palette]
  blue-bell = '#9aa5ce'
  blue-black = '#565f89'
  celeste-blue = '#b4f9f8'
  light-sky-blue = '#7dcfff'
  main-bg = '#24283b'
  pastal-grey = '#cfc9c2'
  pistachio-green = '#9ece6a'
  t-background = 'p:main-bg'
  terminal-black = '#414868'
  terminal-blue = '#7aa2f7'
  terminal-green = '#73daca'
  terminal-magenta = '#bb9af7'
  terminal-red = '#f7768e'
  terminal-white = '#c0caf5'
  terminal-yellow = '#e0af68'
  white-blue = '#a9b1d6'

[secondary_prompt]
  template = '➜ '
  foreground = 'p:terminal-blue'
  background = 'transparent'

[transient_prompt]
  template = '➜ '
  foreground = 'p:terminal-blue'
  background = 'p:t-background'

[upgrade]
  source = 'cdn'
  interval = '168h'
  auto = false
  notice = false

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    template = '➜ '
    foreground = 'p:terminal-blue'
    background = 'transparent'
    type = 'text'
    style = 'plain'

  [[blocks.segments]]
    template = '<b>{{ .Path }}</b> <p:light-sky-blue>⚡</>'
    foreground = 'p:terminal-magenta'
    type = 'path'
    style = 'plain'

  [[blocks.segments]]
    template = '󱃾 <b>{{ .Cluster }}{{ if .Namespace }}::{{ .Namespace }}{{ end }}</b> '
    foreground = 'p:pistachio-green'
    type = 'kubectl'
    style = 'plain'

    [blocks.segments.options.cluster_aliases]
    "api-kafka04t-sbb-aws-test-net:6443" = "kafka04t"

  [[blocks.segments]]
    template = '{{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}'
    foreground = 'p:light-sky-blue'
    type = 'git'
    style = 'plain'

    [blocks.segments.properties]
      branch_icon = '   '
      cache_duration = 'none'
      fetch_status = true

  [[blocks.segments]]
    template = ' '
    foreground = 'p:terminal-red'
    type = 'status'
    style = 'plain'

[[blocks]]
  type = 'prompt'
  alignment = 'right'
  overflow = 'hide'

  [[blocks.segments]]
    template = ' {{ .Full }} '
    foreground = 'p:pistachio-green'
    type = 'node'
    style = 'plain'

  [[blocks.segments]]
    template = ' {{ .Full }}'
    foreground = 'p:terminal-yellow'
    type = 'python'
    style = 'plain'

  [[blocks.segments]]
    template = ' {{ .Full}}'
    foreground = 'p:terminal-red'
    type = 'java'
    style = 'plain'

  [[blocks.segments]]
    template = ' {{ .Full}}'
    foreground = 'p:terminal-red'
    type = 'rust'
    style = 'plain'

  [[blocks.segments]]
    template = 'ﳑ {{ .Full}}'
    foreground = 'p:light-sky-blue'
    type = 'go'
    style = 'plain'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '▶'
    foreground = 'p:pistachio-green'
    type = 'text'
    style = 'plain'
