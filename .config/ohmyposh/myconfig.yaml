# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

palette:
  blue-bell: "#9aa5ce"
  blue-black: "#565f89"
  celeste-blue: "#b4f9f8"
  light-sky-blue: "#7dcfff"
  main-bg: "#24283b"
  pastal-grey: "#cfc9c2"
  pistachio-green: "#9ece6a"
  t-background: p:main-bg
  terminal-black: "#414868"
  terminal-blue: "#7aa2f7"
  terminal-green: "#73daca"
  terminal-magenta: "#bb9af7"
  terminal-red: "#f7768e"
  terminal-white: "#c0caf5"
  terminal-yellow: "#e0af68"
  white-blue: "#a9b1d6"
secondary_prompt:
  template: "➜ "
  foreground: p:terminal-blue
  background: transparent
transient_prompt:
  template: "➜ "
  foreground: p:terminal-blue
  background: p:t-background
terminal_background: p:t-background
console_title_template: " {{ .Folder }} :: {{if .Root}}Admin{{end}}"
upgrade:
  source: cdn
  interval: 168h
  auto: false
  notice: false
blocks:
  - type: prompt
    alignment: left
    segments:
      - template: "➜ "
        foreground: p:terminal-blue
        background: transparent
        type: text
        style: plain
      - template: "{{ .HostName }} "
        foreground: p:terminal-white
        background: transparent
        type: session
        style: plain
      - template: <b>{{ .Path }}</b> <p:light-sky-blue>⚡</>
        foreground: p:terminal-magenta
        type: path
        style: plain
      - template: "\U000f10fe <b>{{ .Context }}{{ if .Namespace }}::{{ .Namespace }}{{ end }}</b> "
        foreground: p:pistachio-green
        type: kubectl
        style: plain
        options:
          parse_kubeconfig: true
          cluster_aliases:
            api-kafka04t-sbb-aws-test-net:6443: kafka04t
          context_aliases:
            kafka-connect-dev01/api-kafka04t-sbb-aws-test-net:6443/u238748: kafka04t
      - type: git
        style: plain
        foreground: "p:light-sky-blue"
        template:
          "{{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus
          }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and
          (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} 
          {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{
          end }}"
        options:
          fetch_status: true
          fetch_upstream_icon: true
          mapped_branches:
            feat/*: "🚀 "
            bug/*: "🐛 "
      - template: " \uf00d"
        foreground: p:terminal-red
        type: status
        style: plain
  - type: prompt
    alignment: right
    overflow: hide
    segments:
      - template: "\ue718 {{ .Full }} "
        foreground: p:pistachio-green
        type: node
        style: plain
      - template:  {{ .Full }}
        foreground: p:terminal-yellow
        type: python
        style: plain
      - template:  {{ .Full}}
        foreground: p:terminal-red
        type: java
        style: plain
      - template:  {{ .Full}}
        foreground: p:terminal-red
        type: rust
        style: plain
      - template: ﳑ {{ .Full}}
        foreground: p:light-sky-blue
        type: go
        style: plain
  - type: prompt
    alignment: left
    segments:
      - template: ▶
        foreground: p:pistachio-green
        type: text
        style: plain
    newline: true
version: 3
final_space: true
