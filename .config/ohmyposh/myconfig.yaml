# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

palette:
  blue-bell: "#859289"
  blue-black: "#7a8478"
  celeste-blue: "#83c092"
  light-sky-blue: "#83c092"
  main-bg: "#2d353b"
  pastal-grey: "#9da9a0"
  pistachio-green: "#a7c080"
  t-background: p:main-bg
  terminal-black: "#475258"
  terminal-blue: "#7fbbb3"
  terminal-green: "#a7c080"
  terminal-magenta: "#d699b6"
  terminal-red: "#e67e80"
  terminal-white: "#d3c6aa"
  terminal-yellow: "#dbbc7f"
  white-blue: "#d3c6aa"
secondary_prompt:
  template: "→ "
  foreground: p:terminal-blue
  background: transparent
transient_prompt:
  template: "→ "
  foreground: p:terminal-blue
  background: transparent
terminal_background: p:terminal-blue
console_title_template: " {{ .Folder }} :: {{if .Root}}Admin{{end}}"
upgrade:
  source: cdn
  interval: 168h
  auto: false
  notice: false
blocks:
  - type: prompt
    alignment: left
    segments:
      - template: " {{ .Icon }} "
        foreground: p:main-bg
        background: p:terminal-blue
        type: os
        style: powerline
        powerline_symbol: ""
      - template: "  {{ .HostName }} "
        foreground: p:terminal-white
        background: p:terminal-black
        type: session
        style: powerline
        powerline_symbol: ""
      - template: "  <b>{{ .Path }}</b> "
        foreground: p:main-bg
        background: p:terminal-magenta
        type: path
        style: powerline
        powerline_symbol: ""
      - template: " \U000f10fe <b>{{ $c := splitList \"-\" .Cluster }}{{ if ge (len $c) 2 }}{{ index $c 1 }}{{ else }}{{ .Cluster }}{{ end }}{{ if .Namespace }}::{{ .Namespace }}{{ end }}</b> "
        foreground: p:main-bg
        background: p:pistachio-green
        type: kubectl
        style: powerline
        powerline_symbol: ""
        properties:
          parse_kubeconfig: true
          display_error: false
      - type: git
        style: powerline
        powerline_symbol: ""
        foreground: p:main-bg
        background: p:terminal-yellow
        template:
          " {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus
          }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and
          (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}
          {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{
          end }} "
        properties:
          fetch_status: true
          fetch_upstream_icon: true
          mapped_branches:
            feat/*: "🚀 "
            bug/*: "🐛 "
      - template: "  "
        foreground: p:main-bg
        background: p:terminal-red
        type: status
        style: powerline
        powerline_symbol: ""
  - type: prompt
    alignment: right
    overflow: hide
    segments:
      - template: "  {{ .Full }} "
        foreground: p:pistachio-green
        background: transparent
        type: node
        style: plain
      - template: "  {{ .Full }} "
        foreground: p:terminal-yellow
        background: transparent
        type: python
        style: plain
      - template: "  {{ .Full }} "
        foreground: p:terminal-red
        background: transparent
        type: java
        style: plain
      - template: "  {{ .Full }} "
        foreground: p:terminal-white
        background: transparent
        type: rust
        style: plain
      - template: "  {{ .Full }} "
        foreground: p:light-sky-blue
        background: transparent
        type: go
        style: plain
  - type: prompt
    alignment: left
    segments:
      - template: " ▶ "
        foreground: p:main-bg
        background: p:pistachio-green
        type: text
        style: plain
      - template: ""
        foreground: p:pistachio-green
        background: transparent
        type: text
        style: plain
    newline: true
version: 3
final_space: true
