# Vibe config for the containerized run: only the local vllm-mlx server on the host.
active_model = "local-code"

[[providers]]
name = "local"
api_base = "http://host.containers.internal:8080/v1"
api_key_env_var = ""

[[models]]
name = "study"
provider = "local"
alias = "local-study"

[[models]]
name = "code"
provider = "local"
alias = "local-code"
