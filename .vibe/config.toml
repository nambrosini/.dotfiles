theme = "gruvbox"
applied_migrations = [
    "bash_read_only_defaults_v1",
]
active_model = "mistral-large-4"

[[models]]
name = "mistral-large-4"
provider = "mistral"
alias = "mistral-large-4"
thinking = "medium"

[[models]]
alias = "glm-5-3"
name = "zai-glm-5-3"
provider = "mistral"
thinking = "high"

[[models]]
thinking = "high"
alias = "mistral-large-4-0-3"

[[mcp_servers]]
name = "garmin"
transport = "stdio"
command = "uvx"
args = [
    "--python",
    "3.12",
    "--from",
    "git+https://github.com/Taxuspt/garmin_mcp",
    "garmin-mcp",
]

[mcp_servers.auth]
type = "oauth"
scopes = []

[tools.garmin_get_activities_by_date]
permission = "always"

[tools.garmin_get_stats]
permission = "always"

[tools.garmin_get_training_status]
permission = "always"

[tools.garmin_get_hrv_data]
permission = "always"

[tools.garmin_get_heart_rate_zones]
permission = "always"

[tools.garmin_get_race_predictions]
permission = "always"

[tools.garmin_get_workouts]
permission = "always"

[tools.garmin_get_endurance_score]
permission = "always"

[tools.garmin_get_weigh_ins]
permission = "always"

